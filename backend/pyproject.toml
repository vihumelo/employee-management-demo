[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["ANN", "B", "E", "F", "I", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
include = ["app", "main.py", "alembic/env.py", "alembic/versions", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
